plugins { id 'com.android.application' }

// Assinatura (CI): KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. Sem KEYSTORE_FILE, usa a keystore debug padrão.
def ksFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.alpineagent'
    compileSdk 34
    defaultConfig {
        applicationId 'com.alpineagent'
        minSdk 26
        targetSdk 28   // necessário p/ executar binários (proot) de dentro do app, como o Termux
        versionCode 1
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        main {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { if (ksFile) signingConfig signingConfigs.main }
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.main
        }
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
