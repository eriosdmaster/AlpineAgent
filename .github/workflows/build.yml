name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar o Release ao subir uma tag

jobs:
  # Compila o proot estático aarch64 (upstream proot-me/proot, musl, em container Alpine arm64 via QEMU).
  # Fica em cache: só recompila se mudar a chave (proot-aarch64-v1).
  proot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: proot-out
          key: proot-aarch64-v1

      - uses: docker/setup-qemu-action@v3
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          platforms: arm64

      - name: Compilar proot estático
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p proot-out
          docker run --rm --platform linux/arm64 -v "$PWD/proot-out:/out" alpine:3.20 sh -ec '
            apk add --no-cache build-base git talloc-dev talloc-static linux-headers
            git clone --depth 1 https://github.com/proot-me/proot /src
            cd /src/src
            make loader.elf build.h
            LDFLAGS="-static -ltalloc" make proot
            strip proot
            cp proot /out/proot'
          file proot-out/proot || true

      - uses: actions/upload-artifact@v4
        with:
          name: proot-aarch64
          path: proot-out/proot

  build:
    needs: proot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # proot: usa o commitado em app/src/main/assets/proot, se existir; senão o compilado no job "proot".
      - uses: actions/download-artifact@v4
        with:
          name: proot-aarch64
          path: proot-dl

      - name: Colocar proot nos assets
        run: |
          mkdir -p app/src/main/assets
          [ -f app/src/main/assets/proot ] || cp proot-dl/proot app/src/main/assets/proot

      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 não definido (veja scripts/gen-keystore.sh)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar debug e release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Renomear APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AlpineAgent-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/AlpineAgent-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlpineAgent-apks
          path: dist/*.apk

      - name: Publicar Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
