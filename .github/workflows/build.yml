name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar o Release ao subir uma tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # proot estático aarch64 (opcional): secret PROOT_URL com o link direto do binário.
      # Se o arquivo já estiver commitado em app/src/main/assets/proot, nada é feito.
      - name: Baixar proot
        env:
          PROOT_URL: ${{ secrets.PROOT_URL }}
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/proot ] && [ -n "$PROOT_URL" ]; then
            curl -fsSL "$PROOT_URL" -o app/src/main/assets/proot
          fi
          [ -f app/src/main/assets/proot ] || echo "::warning::proot ausente: o terminal Alpine não vai funcionar no APK"

      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 não definido (veja scripts/gen-keystore.sh)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar debug e release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Renomear APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AlpineAgent-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/AlpineAgent-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlpineAgent-apks
          path: dist/*.apk

      - name: Publicar Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
